<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Test HTML5 Validation</title>
</head>
<body>
    <h2>Kiểm tra Validation HTML5</h2>
    <form action="#">
        <p>TH1 (Trống): <input type="text" required value=""></p>
        <p>TH2 (Email sai): <input type="email" value="abc"></p>
        <p>TH3 (Quá max): <input type="number" min="1" max="10" value="15"></p>
        <p>TH4 (Sai pattern): <input type="text" pattern="[0-9]{10}" value="abc123"></p>
        <p>TH5 (Quá ngắn): <input type="password" minlength="8" value="123"></p>
        
        <button type="submit">Submit Thử</button>
    </form>
</body>
</html>
